<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Quiz</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="bg">
  <main class="wrap">

    <header class="head">
      <h1>🧠 Quiz</h1>
      <div class="meta">
        <span id="unitTag" class="pill"></span>
        <span id="progress" class="pill"></span>
      </div>
    </header>

    <section id="quizCard" class="card">
      <h2 id="qTitle"></h2>
      <div id="options" class="options"></div>

      <div id="feedback" class="feedback hidden"></div>

      <div class="actions">
        <button id="next" class="btn">Siguiente</button>
        <button id="finish" class="btn btn-ghost hidden">Finalizar</button>
      </div>
    </section>

    <section id="resultCard" class="card hidden">
      <h2>📊 Resultados</h2>
      <p id="score"></p>

      <h3>❌ En qué te equivocaste</h3>
      <div id="errors"></div>

      <div class="actions">
        <a class="btn" href="index.html">Volver</a>
        <a class="btn btn-ghost" href="quiz.html" onclick="location.reload()">Reintentar</a>
      </div>
    </section>

  </main>

    <script defer src="./js/questions.js"></script>
    <script defer src="./js/quiz.js"></script>
</body>
</html>
